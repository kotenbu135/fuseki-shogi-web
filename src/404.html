<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません — 布石将棋</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f7f5f0; --fg: #1d1b16; --muted: #6b665c; --line: #d9d4c8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --fg: #eae7df; --muted: #9b958a; --line: #34313a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7; padding: 3rem 1.25rem;
  }
  .wrap { max-width: 44rem; margin: 0 auto; }
  .code { font-size: .8rem; letter-spacing: .12em; color: var(--muted);
          font-weight: 600; margin: 0 0 .3rem; }
  h1 { font-size: 1.9rem; margin: 0 0 .3rem; letter-spacing: .02em; }
  .lead { color: var(--muted); margin: 0 0 2rem; }
  p { margin: 0 0 1rem; }
  footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
           color: var(--muted); font-size: .85rem; }
  a { color: inherit; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; }
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>ページが見つかりません</h1>
  <p class="lead">そのURLに置いてあるものはありません。</p>

  <!-- このページは任意の深さのパスで出る（/a/b/c でもここが返る）ので、
       リンクは相対にできない。必ず / 始まりにすること。 -->
  <p><a href="/">トップへ戻る</a></p>

  <footer>
    <p>GPL-3.0。ソースは <a href="https://github.com/kotenbu135/fuseki-shogi-web">fuseki-shogi-web</a>。</p>
    <p>ビルド: <!--BUILD_INFO--></p>
  </footer>
</div>
</body>
</html>
