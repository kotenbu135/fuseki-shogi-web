<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布石将棋</title>
<meta name="description" content="空の盤に20枚ずつ打ってから指す変則将棋「布石将棋」を、ブラウザだけで対局する。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<meta property="og:type" content="website">
<meta property="og:title" content="布石将棋">
<meta property="og:description" content="空の盤に交互に20枚ずつ打ってから指す変則将棋。ブラウザだけで対局できる。">
<meta property="og:url" content="https://fusekishogi.com/">
<meta name="twitter:card" content="summary">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-title">
      <h1>布石将棋</h1>
      <p class="tagline">空の盤に交互に20枚ずつ打つ。41手目からは普通の将棋。</p>
    </div>
    <!-- 表示の設定。対局の設定（手番・持ち時間・強さ）とは分ける。あちらは対局前だけ、
         こちらは対局中も触れる。 -->
    <button type="button" class="gear" id="btn-settings" title="表示の設定"
            aria-expanded="false" aria-controls="display-settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.7 8.84a.5.5 0 00.12.64l2.03 1.58a7.07 7.07 0 000 1.88L2.82 14.5a.5.5 0 00-.12.64l1.92 3.32c.12.22.39.3.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.12-.56 1.62-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
      <span class="sr-only">表示の設定</span>
    </button>
    <div class="settings-pop" id="display-settings" hidden>
      <label>盤の大きさ
        <input type="range" id="opt-scale" min="70" max="115" step="5" value="100"
               aria-label="盤の大きさ">
      </label>
      <label>音量
        <input type="range" id="opt-volume" min="0" max="100" step="5" value="70"
               aria-label="音量">
      </label>
      <label>配色
        <select id="opt-theme">
          <option value="auto" selected>自動（端末に合わせる）</option>
          <option value="light">明るい</option>
          <option value="dark">暗い</option>
        </select>
      </label>
      <!-- 対局中に形勢が見えると、対局として面白くない。既定では隠す。 -->
      <label class="check">
        <input type="checkbox" id="opt-show-eval">
        <span>対局中もAIの評価を見せる</span>
      </label>
      <button type="button" class="pop-link" id="btn-io-open">局面の受け渡し…</button>
    </div>
  </header>

  <main class="layout">
    <section class="board-column">
      <!-- 評価ゲージ。通常フェーズだけ出す。布石フェーズの「採用手の確率」は
           方策の自信であって優劣ではないので、両側に振れる帯には載せない。 -->
      <div class="eval-gauge" id="eval-gauge" hidden aria-hidden="true">
        <div class="eval-gauge-fill" id="eval-gauge-fill"></div>
      </div>
      <!-- 駒台のDOMは shogiground が .sg-wrap の直下に作る（board.js の hands.inlined）。
           ここに器を置くと二重になるので置かない。 -->
      <div id="board"></div>
    </section>

    <aside class="panel">
      <!-- 上の席（盤の向こう側）と下の席（手前）。lishogiと同じで、棋譜を
           2つの席で挟む。時計は1手ごとの消費ではなく、その色が考えた累計。 -->
      <div class="seat" id="seat-top">
        <span class="seat-name" id="seat-top-name">後手</span>
        <span class="clock" id="clock-top">0:00</span>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        <p class="status-line" id="status-line">読み込み中…</p>
        <p class="status-sub" id="status-sub"></p>
      </div>

      <dl class="readout">
        <div><dt>手数</dt><dd id="readout-ply">—</dd></div>
        <div><dt>フェーズ</dt><dd id="readout-phase">—</dd></div>
        <div id="readout-eval-row"><dt>評価</dt><dd id="readout-eval">—</dd></div>
      </dl>

      <!-- 誰がその数字を言っているか。通常フェーズはやねうら王の深さ・NPS・読み筋。
           布石フェーズはエンジン名だけ（出せる数字が形勢ではないので並べない）。 -->
      <div class="engine" id="engine" hidden>
        <p class="engine-head" id="engine-head"></p>
        <p class="engine-pv" id="engine-pv"></p>
      </div>

      <div class="kifu-box">
        <h2>棋譜</h2>
        <ol class="kifu" id="kifu"></ol>
        <!-- 棋譜をさかのぼる。lishogiと同じ並び（最初・1手戻る・1手進む・最新）。 -->
        <div class="kifu-nav">
          <button type="button" id="nav-first" title="最初の局面へ（Home）" aria-label="最初の局面へ" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 6h2.2v12H7z"/><path d="M18 6v12l-8-6z"/></svg></button>
          <button type="button" id="nav-prev" title="1手戻る（←）" aria-label="1手戻る" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6v12l-8-6z"/></svg></button>
          <button type="button" id="nav-next" title="1手進む（→）" aria-label="1手進む" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6v12l8-6z"/></svg></button>
          <button type="button" id="nav-last" title="最新の局面へ（End）" aria-label="最新の局面へ" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.8 6H17v12h-2.2z"/><path d="M6 6v12l8-6z"/></svg></button>
        </div>

        <!-- 対局中の操作は棋譜のすぐ下。lishogiもここに置いている。 -->
        <div class="kifu-actions">
          <button type="button" id="btn-flip" title="盤を反転">盤を反転</button>
          <button type="button" id="btn-undo" disabled title="自分の直前の一手を取り消す">待った</button>
          <button type="button" id="btn-resign" disabled title="投了する">投了</button>
        </div>

      </div>

      <!-- 終局したら、次にできることを結果のそばに出す。対局開始は設定の一番下に
           あって結果から遠い（lishogiは結果の直下に並べる）。
           .kifu-box の中には置かない。あちらは flex:1 1 0 で縮む枠で、
           高さが乗り切らずに下の席と重なる。 -->
      <div class="result-actions" id="result-actions" hidden>
        <button type="button" id="btn-again" class="primary">もう一局</button>
        <button type="button" id="btn-replay">並べ直す</button>
        <button type="button" id="btn-copy-kifu">棋譜をコピー</button>
        <button type="button" id="btn-settings-again">設定を変える</button>
      </div>

      <div class="seat" id="seat-bottom">
        <span class="seat-name" id="seat-bottom-name">先手</span>
        <span class="clock" id="clock-bottom">0:00</span>
      </div>

      <form class="controls" id="controls">
        <label>手番
          <select id="opt-color">
            <option value="sente" selected>先手（下）</option>
            <option value="gote">後手（上）</option>
            <option value="random">ランダム</option>
          </select>
        </label>
        <label title="レベル1〜2は布石の打ち方が散り、3〜5の差は41手目以降の読みの深さに出る">AIの強さ
          <select id="opt-level">
            <option value="1">レベル1 やさしい</option>
            <option value="2">レベル2</option>
            <option value="3" selected>レベル3</option>
            <option value="4">レベル4</option>
            <option value="5">レベル5 手強い</option>
          </select>
        </label>
        <label class="wide" title="人間側だけの持ち時間。AIの持ち時間はレベル（1手あたりの思考時間）が決める">あなたの持ち時間
          <select id="opt-time">
            <option value="none" selected>無制限</option>
            <option value="3m">3分切れ負け</option>
            <option value="10s">10秒将棋</option>
            <option value="10m+30s">10分＋30秒</option>
            <option value="5m+5s">5分＋5秒加算</option>
          </select>
        </label>
        <div class="buttons" id="start-row">
          <button type="button" id="btn-new" class="primary" disabled>対局開始</button>
        </div>
      </form>
    </aside>
  </main>

  <!-- 局面の受け渡し。パネルの中に置くと、開いたときにパネルが盤より背高になって
       レイアウトが崩れる。dialog はフローの外なので、どの画面幅でも盤に触らない。
       布石フェーズには局面を書き込むAPIが無い（fuseki.js は reset と drop だけ）ので、
       渡せるのは手順のほう。SFENは出力だけ。 -->
  <dialog class="io-dialog" id="io-dialog">
    <form method="dialog" class="io-dialog-head">
      <h2>局面の受け渡し</h2>
      <button class="io-close" value="close" aria-label="閉じる">✕</button>
    </form>
    <label>手順（USI）
      <textarea id="io-moves" rows="4" spellcheck="false"
                placeholder="P*5g P*5c G*4h … と空白区切りで貼る"></textarea>
    </label>
    <div class="moves-io-actions">
      <button type="button" id="btn-io-load">この手順から始める</button>
      <button type="button" id="btn-io-copy">手順をコピー</button>
    </div>
    <p class="io-note" id="io-note"></p>
    <label>SFEN（出力のみ）
      <input type="text" id="io-sfen" readonly spellcheck="false" value="">
    </label>
    <p class="io-note">布石フェーズのSFENは持ち駒に玉が入る布石将棋の拡張で、ふつうの将棋ソフトでは読めない。41手目以降は標準のSFEN。</p>
  </dialog>

  <footer class="app-footer">
    <p>
      布石フェーズは布石エンジン、41手目以降は
      <a href="https://github.com/mizar/YaneuraOu.wasm">やねうら王</a> のWASMビルドが指す。
      盤は <a href="https://github.com/WandererXII/shogiground">shogiground</a>、
      通常将棋のルールは <a href="https://github.com/WandererXII/shogiops">shogiops</a>。
    </p>
    <p>
      GPL-3.0。ソースは <a href="https://github.com/kotenbu135/fuseki-shogi-web">fuseki-shogi-web</a>。
    </p>
    <p>
      ビルド: <!--BUILD_INFO-->
    </p>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
