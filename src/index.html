<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布石将棋</title>
<meta name="description" content="空の盤に20枚ずつ打ってから指す変則将棋「布石将棋」を、ブラウザだけで対局する。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>布石将棋</h1>
    <p class="tagline">空の盤に交互に20枚ずつ打つ。41手目からは普通の将棋。</p>
  </header>

  <main class="layout">
    <section class="board-column">
      <!-- 駒台のDOMは shogiground が .sg-wrap の直下に作る（board.js の hands.inlined）。
           ここに器を置くと二重になるので置かない。 -->
      <div id="board"></div>
    </section>

    <aside class="panel">
      <!-- 上の席（盤の向こう側）と下の席（手前）。lishogiと同じで、棋譜を
           2つの席で挟む。時計は1手ごとの消費ではなく、その色が考えた累計。 -->
      <div class="seat" id="seat-top">
        <span class="seat-name" id="seat-top-name">後手</span>
        <span class="clock" id="clock-top">0:00</span>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        <p class="status-line" id="status-line">読み込み中…</p>
        <p class="status-sub" id="status-sub"></p>
      </div>

      <dl class="readout">
        <div><dt>手数</dt><dd id="readout-ply">—</dd></div>
        <div><dt>フェーズ</dt><dd id="readout-phase">—</dd></div>
        <div><dt>評価</dt><dd id="readout-eval">—</dd></div>
      </dl>

      <div class="kifu-box">
        <h2>棋譜</h2>
        <ol class="kifu" id="kifu"></ol>
        <!-- 棋譜をさかのぼる。lishogiと同じ並び（最初・1手戻る・1手進む・最新）。 -->
        <div class="kifu-nav">
          <button type="button" id="nav-first" title="最初の局面へ（Home）" aria-label="最初の局面へ" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 6h2.2v12H7z"/><path d="M18 6v12l-8-6z"/></svg></button>
          <button type="button" id="nav-prev" title="1手戻る（←）" aria-label="1手戻る" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6v12l-8-6z"/></svg></button>
          <button type="button" id="nav-next" title="1手進む（→）" aria-label="1手進む" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6v12l8-6z"/></svg></button>
          <button type="button" id="nav-last" title="最新の局面へ（End）" aria-label="最新の局面へ" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.8 6H17v12h-2.2z"/><path d="M6 6v12l8-6z"/></svg></button>
        </div>

        <!-- 対局中の操作は棋譜のすぐ下。lishogiもここに置いている。 -->
        <div class="kifu-actions">
          <button type="button" id="btn-flip" title="盤を反転">盤を反転</button>
          <button type="button" id="btn-resign" disabled title="投了する">投了</button>
        </div>
      </div>

      <div class="seat" id="seat-bottom">
        <span class="seat-name" id="seat-bottom-name">先手</span>
        <span class="clock" id="clock-bottom">0:00</span>
      </div>

      <form class="controls" id="controls">
        <label>手番
          <select id="opt-color">
            <option value="sente" selected>先手（下）</option>
            <option value="gote">後手（上）</option>
          </select>
        </label>
        <label>音量
          <input type="range" id="opt-volume" min="0" max="100" step="5" value="70"
                 aria-label="音量">
        </label>
        <label>持ち時間（1手）
          <select id="opt-movetime">
            <option value="500">0.5秒</option>
            <option value="1000" selected>1秒</option>
            <option value="3000">3秒</option>
            <option value="10000">10秒</option>
          </select>
        </label>
        <div class="buttons">
          <button type="button" id="btn-new" class="primary" disabled>対局開始</button>
        </div>
      </form>
    </aside>
  </main>

  <footer class="app-footer">
    <p>
      布石フェーズは布石方策（NN前向き1回）、41手目以降は
      <a href="https://github.com/mizar/YaneuraOu.wasm">やねうら王</a> のWASMビルドが指す。
      盤は <a href="https://github.com/WandererXII/shogiground">shogiground</a>、
      通常将棋のルールは <a href="https://github.com/WandererXII/shogiops">shogiops</a>。
    </p>
    <p>
      GPL-3.0。ソースは <a href="https://github.com/kotenbu135/fuseki-shogi-web">fuseki-shogi-web</a>。
    </p>
    <p>
      ビルド: <!--BUILD_INFO-->
    </p>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
